services:
  # ── DELIGO: PostgreSQL ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: deligo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: deligo_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d deligo_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── DELIGO: Redis ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: deligo-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    container_name: deligo-rustfs
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: ':9001'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rustfsdata:/data

  # ── DELIGO: Prisma Migration ────────────────────────────
  migration:
    build:
      context: .
      target: dependencies
    container_name: deligo-migration
    command: sh -c "npx prisma migrate deploy && npx prisma generate"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/deligo_db?schema=public'
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # ── DELIGO: API ─────────────────────────────────────────
  api:
    build:
      context: .
      target: dependencies
    container_name: deligo-api
    command: sh -c "npx prisma generate && npm run dev"
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/deligo_db?schema=public'
      REDIS_URL: 'redis://redis:6379'
      ENABLE_WORKER: 'false'
      JWT_SECRET: 'deligo_development_jwt_secret_key_at_least_32_chars_long'
      JWT_REFRESH_SECRET: 'deligo_development_jwt_refresh_secret_at_least_32_chars'
      RUSTFS_ENDPOINT: 'http://rustfs:9000'
      RUSTFS_REGION: 'us-east-1'
      RUSTFS_ACCESS_KEY: 'rustfsadmin'
      RUSTFS_SECRET_KEY: 'rustfsadmin'
      RUSTFS_BUCKET: 'deligo-ride-sharing'
      RUSTFS_PUBLIC_URL: 'http://localhost:9000/deligo-ride-sharing'
      CORS_ORIGIN: 'http://localhost:3000,http://localhost:5173'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_started
      migration:
        condition: service_completed_successfully

  # ── DELIGO: Background Worker ──────────────────────────
  worker:
    build:
      context: .
      target: dependencies
    container_name: deligo-worker
    command: sh -c "npx prisma generate && npm run dev:worker"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      DATABASE_URL: 'postgresql://postgres:postgrespassword@postgres:5432/deligo_db?schema=public'
      REDIS_URL: 'redis://redis:6379'
      JWT_SECRET: 'deligo_development_jwt_secret_key_at_least_32_chars_long'
      JWT_REFRESH_SECRET: 'deligo_development_jwt_refresh_secret_at_least_32_chars'
      RUSTFS_ENDPOINT: 'http://rustfs:9000'
      RUSTFS_REGION: 'us-east-1'
      RUSTFS_ACCESS_KEY: 'rustfsadmin'
      RUSTFS_SECRET_KEY: 'rustfsadmin'
      RUSTFS_BUCKET: 'deligo-ride-sharing'
      RUSTFS_PUBLIC_URL: 'http://localhost:9000/deligo-ride-sharing'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  # ── DOCMOST: Documentation Application ─────────────────
  docmost:
    image: docmost/docmost:latest
    container_name: deligo-docmost
    environment:
      APP_URL: 'http://localhost:3001'
      APP_SECRET: ${DOCMOST_APP_SECRET:?Set DOCMOST_APP_SECRET in .env}
      DATABASE_URL: 'postgresql://docmost:${DOCMOST_DB_PASSWORD:?Set DOCMOST_DB_PASSWORD in .env}@docmost-postgres:5432/docmost_db'
      REDIS_URL: 'redis://docmost-redis:6379'
    ports:
      - '3001:3000'
    volumes:
      - docmostdata:/app/data/storage
    depends_on:
      docmost-postgres:
        condition: service_healthy
      docmost-redis:
        condition: service_healthy
    restart: unless-stopped

  # ── DOCMOST: Dedicated PostgreSQL ──────────────────────
  docmost-postgres:
    image: postgres:18
    container_name: deligo-docmost-postgres
    environment:
      POSTGRES_USER: docmost
      POSTGRES_PASSWORD: ${DOCMOST_DB_PASSWORD:?Set DOCMOST_DB_PASSWORD in .env}
      POSTGRES_DB: docmost_db
    volumes:
      - docmost_pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docmost -d docmost_db']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── DOCMOST: Dedicated Redis ───────────────────────────
  docmost-redis:
    image: redis:8
    container_name: deligo-docmost-redis
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - noeviction
    volumes:
      - docmost_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

# ── Persistent Volumes ────────────────────────────────────
volumes:
  # Deligo
  pgdata:
  redisdata:
  rustfsdata:

  # Docmost
  docmostdata:
  docmost_pgdata:
  docmost_redisdata:

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}

  # JWT / sessions
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required in production}
  JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  JWT_REFRESH_EXPIRES_IN_DEFAULT: ${JWT_REFRESH_EXPIRES_IN_DEFAULT:-1d}
  JWT_REFRESH_EXPIRES_IN_REMEMBER: ${JWT_REFRESH_EXPIRES_IN_REMEMBER:-30d}
  SAMESITE_COOKIE: ${SAMESITE_COOKIE:-lax}

  # Storage
  RUSTFS_ENDPOINT: ${RUSTFS_ENDPOINT:?RUSTFS_ENDPOINT is required}
  RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
  RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
  RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
  RUSTFS_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET is required}
  RUSTFS_PUBLIC_URL: ${RUSTFS_PUBLIC_URL:-}
  UPLOAD_ALLOWED_URL_HOSTS: ${UPLOAD_ALLOWED_URL_HOSTS:-}

  # Email (SMTP and/or Resend)
  SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Deligo Ride}
  EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@deligo.com}
  RESEND_API_KEY: ${RESEND_API_KEY:-}

  # Maps, SMS, push
  MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
  BULKGATE_APPLICATION_ID: ${BULKGATE_APPLICATION_ID:-}
  BULKGATE_APPLICATION_TOKEN: ${BULKGATE_APPLICATION_TOKEN:-}
  FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-./firebase-service-account.json}

  # Social login
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_ANDROID_CLIENT_ID: ${GOOGLE_ANDROID_CLIENT_ID:-}
  GOOGLE_IOS_CLIENT_ID: ${GOOGLE_IOS_CLIENT_ID:-}
  FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
  FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
  META_APP_ID: ${META_APP_ID:-}
  META_APP_SECRET: ${META_APP_SECRET:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}

  # Frontend / CORS
  ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL:-}
  CORS_ORIGIN: ${CORS_ORIGIN:-}

services:
  api:
    build:
      context: .
      target: runner
    container_name: deligo-api-prod
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      <<: *app-env
      PORT: 3000
      ENABLE_WORKER: ${ENABLE_WORKER:-false}
    command: ['node', 'dist/server.js']

  worker:
    build:
      context: .
      target: runner
    container_name: deligo-worker-prod
    restart: unless-stopped
    environment:
      <<: *app-env
    command: ['node', 'dist/worker.js']
